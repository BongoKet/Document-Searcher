<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Excel Search v4</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 3v18M3 15h18"/>
      </svg>
      <span class="app-title">Excel Search</span>
      <span class="version-badge">v4</span>
    </div>
    <div class="header-right" id="statsBar" hidden>
      <span class="stat" id="statScanned"></span>
      <span class="stat-divider">·</span>
      <span class="stat" id="statResults"></span>
      <span class="stat-divider">·</span>
      <span class="stat" id="statErrors"></span>
    </div>
  </header>

  <!-- ── Search Panel ──────────────────────────────────────────── -->
  <section class="search-panel">
    <!-- Folder row -->
    <div class="input-row">
      <label class="input-label" for="folderInput">Folder</label>
      <div class="input-with-btn">
        <input id="folderInput" type="text" class="text-input" placeholder="Select or type a folder path…" spellcheck="false" />
        <button id="browseBtn" class="btn btn-secondary">Browse</button>
      </div>
    </div>

    <!-- Query row -->
    <div class="input-row">
      <label class="input-label" for="queryInput">Search for</label>
      <div class="input-with-btn">
        <input id="queryInput" type="text" class="text-input" placeholder="Enter text to search for…" spellcheck="false" />
        <button id="searchBtn" class="btn btn-primary">Search</button>
      </div>
    </div>

    <!-- Options row -->
    <div class="options-row">
      <label class="checkbox-label">
        <input type="checkbox" id="optCaseSensitive" />
        <span>Case sensitive</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="optExcel" checked />
        <span>Excel (.xlsx, .xls)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="optWord" checked />
        <span>Word (.docx)</span>
      </label>
    </div>
  </section>

  <!-- ── Progress ──────────────────────────────────────────────── -->
  <div id="progressSection" class="progress-section" hidden>
    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <p id="progressLabel" class="progress-label">Starting…</p>
  </div>

  <!-- ── Results ───────────────────────────────────────────────── -->
  <section id="resultsSection" class="results-section" hidden>
    <div class="results-header">
      <span class="results-title" id="resultsTitle">Results</span>
      <div class="results-controls">
        <input id="filterInput" type="text" class="filter-input" placeholder="Filter results…" />
        <button id="clearBtn" class="btn btn-ghost">Clear</button>
        <button id="exportBtn" class="btn btn-ghost">Export CSV</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="resultsTable">
        <thead>
          <tr>
            <th class="col-file" data-sort="file">File <span class="sort-icon">↕</span></th>
            <th class="col-sheet" data-sort="sheet">Sheet / Section <span class="sort-icon">↕</span></th>
            <th class="col-cell" data-sort="cell">Cell / Location <span class="sort-icon">↕</span></th>
            <th class="col-value">Matched Value</th>
            <th class="col-open"></th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ── Empty / idle state ────────────────────────────────────── -->
  <div id="emptyState" class="empty-state">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="8" y="4" width="32" height="40" rx="3"/>
      <path d="M16 16h16M16 24h16M16 32h10"/>
      <circle cx="36" cy="36" r="8"/>
      <path d="M33 36h6M36 33v6"/>
    </svg>
    <p>Select a folder and enter a search term to begin.</p>
  </div>

  <!-- ── Error toast ───────────────────────────────────────────── -->
  <div id="errorToast" class="error-toast" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>
